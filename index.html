<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLVO | Career OS 3.0</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React Engine -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 3. Babel Translator -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts (Inter for that crisp macOS look) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pulse animation for notifications */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .animate-pulse-ring::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: #EF4444;
            border-radius: 50%;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] font-sans selection:bg-blue-500/30 selection:text-blue-900 overflow-x-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON DEFINITIONS ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Compass = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></IconWrapper>;
        const Layout = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></IconWrapper>;
        const Cpu = (p) => <IconWrapper {...p}><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></IconWrapper>;
        const Layers = (p) => <IconWrapper {...p}><path d="m12.83 2.46 9.15 5.32a.6.6 0 0 1 .04 1.06l-9.18 5.26a.6.6 0 0 1-.53 0L3.16 8.84a.6.6 0 0 1 .04-1.06l9.15-5.32a.6.6 0 0 1 .48 0Z"/><path d="M12 10.5v9"/><path d="m22 7-10 5.5L2 7"/><path d="m2 17 10 5.5 10-5.5"/></IconWrapper>;
        const ArrowRight = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconWrapper>;
        const CheckCircle2 = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
        const Zap = (p) => <IconWrapper {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>;
        const TrendingUp = (p) => <IconWrapper {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconWrapper>;
        const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconWrapper>;
        const Kanban = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v10"/></IconWrapper>;
        const GraduationCap = (p) => <IconWrapper {...p}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></IconWrapper>;
        const PlayCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></IconWrapper>;
        const Database = (p) => <IconWrapper {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></IconWrapper>;
        const Users = (p) => <IconWrapper {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
        const Command = (p) => <IconWrapper {...p}><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></IconWrapper>;
        const Settings = (p) => <IconWrapper {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconWrapper>;
        const Bell = (p) => <IconWrapper {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></IconWrapper>;
        const MoreHorizontal = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></IconWrapper>;
        const Plus = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>;
        const Calendar = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconWrapper>;
        const PieChart = (p) => <IconWrapper {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconWrapper>;
        const Activity = (p) => <IconWrapper {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconWrapper>;
        const Maximize2 = (p) => <IconWrapper {...p}><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></IconWrapper>;
        const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
        const X = (p) => <IconWrapper {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconWrapper>;
        const BrainCircuit = (p) => <IconWrapper {...p}><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M6 18a4 4 0 0 1-1.97-3.284"/><path d="M8.5 18a5 5 0 0 0 7 0"/><path d="M15.5 11a4 4 0 0 0 3.8-1.5"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4"/><path d="M17.997 5.125a3 3 0 0 1-.398 1.375"/><path d="M20.523 10.896a4 4 0 0 0-.585-.396"/><path d="M18 18a4 4 0 0 0 1.97-3.284"/></IconWrapper>;

        // --- SUB COMPONENTS FOR OS VIEW ---

        const SidebarItem = ({ icon: Icon, label, isActive, onClick }) => (
            <div 
                onClick={onClick}
                className={`flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer transition-all duration-200 ${isActive ? 'bg-blue-600/20 text-blue-400 font-medium' : 'hover:bg-white/5 text-gray-400'}`}
            >
                <Icon className="w-4 h-4" />
                {label}
            </div>
        );

        const TaskModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="absolute inset-y-0 right-0 w-80 bg-[#252526] border-l border-white/10 shadow-2xl p-6 transform transition-transform duration-300 z-50">
                    <div className="flex justify-between items-center mb-6">
                        <span className="text-xs font-bold text-gray-500 uppercase">Task Details</span>
                        <button onClick={onClose}><X className="w-4 h-4 text-gray-400 hover:text-white" /></button>
                    </div>
                    <h3 className="text-lg font-bold text-white mb-2">Learn Next.js 14</h3>
                    <div className="flex gap-2 mb-6">
                        <span className="bg-[#FAA934] text-black text-[10px] font-bold px-2 py-0.5 rounded">IN PROGRESS</span>
                        <span className="bg-[#E2445C] text-white text-[10px] font-bold px-2 py-0.5 rounded">HIGH</span>
                    </div>
                    <div className="space-y-4">
                        <div className="bg-black/30 p-3 rounded-lg border border-white/5">
                            <div className="text-xs text-gray-400 mb-1">Description</div>
                            <p className="text-sm text-gray-300">Master Server Actions, streaming, and the new App Router architecture.</p>
                        </div>
                        <div className="bg-black/30 p-3 rounded-lg border border-white/5">
                            <div className="text-xs text-gray-400 mb-2">Subtasks</div>
                            <div className="space-y-2">
                                <div className="flex items-center gap-2 text-sm text-gray-300">
                                    <CheckCircle2 className="w-4 h-4 text-green-500" /> Setup Project
                                </div>
                                <div className="flex items-center gap-2 text-sm text-gray-300">
                                    <div className="w-4 h-4 border border-gray-500 rounded-full"></div> Watch Tutorial
                                </div>
                            </div>
                        </div>
                    </div>
                    <button className="w-full mt-8 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-sm font-medium transition-colors">Mark Complete</button>
                </div>
            );
        };

        // --- APP COMPONENT ---

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [activeTab, setActiveTab] = useState('board'); // board, psych, resources
            const [notificationsOpen, setNotificationsOpen] = useState(false);
            const [taskModalOpen, setTaskModalOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen bg-[#F5F5F7] text-[#1D1D1F] font-sans selection:bg-blue-500/30 selection:text-blue-900 overflow-x-hidden">
                
                {/* Dynamic Island Style Nav */}
                <nav className={`fixed top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-5xl z-50 transition-all duration-300 rounded-full px-6 py-4 flex justify-between items-center ${isScrolled ? 'bg-white/70 backdrop-blur-xl shadow-lg border border-white/20' : 'bg-transparent'}`}>
                    <div className="flex items-center gap-2">
                    <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg">S</div>
                    <span className="text-xl font-bold tracking-tight text-black">SOLVO</span>
                    </div>
                    
                    <div className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600 bg-white/50 px-6 py-2 rounded-full border border-white/40 shadow-sm backdrop-blur-md">
                    <a href="#os" className="hover:text-black transition-colors">The OS</a>
                    <a href="#features" className="hover:text-black transition-colors">Features</a>
                    <a href="#pricing" className="hover:text-black transition-colors">Pricing</a>
                    </div>

                    <div className="flex items-center gap-3">
                    <button className="hidden sm:block text-sm font-semibold text-slate-600 hover:text-black transition-colors">Log In</button>
                    <button className="bg-[#0071e3] text-white text-sm font-medium px-5 py-2.5 rounded-full hover:bg-[#0077ED] transition-all shadow-md active:scale-95 flex items-center gap-2">
                        Get Started
                    </button>
                    </div>
                </nav>

                {/* Hero Section */}
                <section className="relative pt-40 pb-20 md:pt-52 md:pb-32 overflow-hidden">
                    {/* Background Ambience */}
                    <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-400/20 rounded-full blur-[120px] mix-blend-multiply animate-pulse"></div>
                    <div className="absolute top-[-20%] right-[-10%] w-[50%] h-[50%] bg-purple-400/20 rounded-full blur-[120px] mix-blend-multiply animate-pulse delay-1000"></div>

                    {/* Subtle Geometric Shapes Layer - UPDATED VISIBILITY */}
                    <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden">
                        {/* 1. Large Faint Concentric Circles (Top Right) */}
                        <svg className="absolute -top-20 -right-20 text-indigo-500 w-[600px] h-[600px] opacity-10" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" strokeWidth="0.5" />
                            <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" strokeWidth="0.5" strokeDasharray="4 4" />
                            <circle cx="50" cy="50" r="25" fill="none" stroke="currentColor" strokeWidth="0.5" />
                        </svg>

                        {/* 2. Large Arc (Bottom Left) */}
                        <svg className="absolute top-1/2 -left-32 w-[600px] h-[600px] text-blue-600 opacity-10" viewBox="0 0 100 100" fill="none">
                            <path d="M 50 0 A 50 50 0 0 0 50 100" stroke="currentColor" strokeWidth="0.5" fill="none" />
                        </svg>

                        {/* 3. Small Floating Circle Outline (Random placement) */}
                        <div className="absolute top-1/3 left-1/4 w-16 h-16 border-2 border-purple-400/30 rounded-full"></div>
                        <div className="absolute bottom-1/4 right-1/4 w-10 h-10 border-2 border-blue-400/30 rounded-full"></div>
                    </div>

                    <div className="max-w-7xl mx-auto px-6 text-center relative z-10">
                        <div className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-md border border-white/40 text-slate-600 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-8 shadow-sm">
                            <Command className="w-3 h-3" /> SOLVO OS 3.0
                        </div>
                        
                        <h1 className="text-5xl md:text-8xl font-bold text-[#1D1D1F] mb-6 tracking-tighter leading-[1.05]">
                            Career management. <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-violet-600">Reinvented.</span>
                        </h1>
                        
                        <p className="text-xl md:text-2xl text-slate-500 max-w-2xl mx-auto mb-12 leading-relaxed font-medium">
                            The power of Monday.com, the intelligence of O*NET, and the simplicity of Apple Notes. All in one dashboard.
                        </p>
                        
                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4 mb-20">
                            <button className="h-14 px-8 rounded-full bg-[#1D1D1F] text-white font-semibold text-lg hover:bg-black transition-transform hover:scale-105 active:scale-95 shadow-2xl flex items-center gap-2">
                            Start Free Discovery <ArrowRight className="w-5 h-5" />
                            </button>
                            <button className="h-14 px-8 rounded-full bg-white text-[#1D1D1F] font-semibold text-lg border border-slate-200 hover:bg-slate-50 transition-all flex items-center gap-2 shadow-sm">
                            <PlayCircle className="w-5 h-5" /> See How It Works
                            </button>
                        </div>

                        {/* --- THE INTERACTIVE OS MOCKUP --- */}
                        <div className="relative mx-auto max-w-6xl animate-fade-in-up">
                            {/* Reflection */}
                            <div className="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent z-20 pointer-events-none h-40 bottom-0"></div>
                            
                            <div className="relative rounded-[2rem] bg-[#1e1e1e] shadow-[0_50px_100px_-20px_rgba(0,0,0,0.5)] border border-white/10 overflow-hidden aspect-[16/10] md:aspect-[16/9] group">
                                {/* OS Window Controls */}
                                <div className="h-12 bg-[#2d2d2d] flex items-center px-5 gap-2 border-b border-white/5 relative z-50">
                                    <div className="flex gap-2">
                                        <div className="w-3 h-3 rounded-full bg-[#FF5F57]"></div>
                                        <div className="w-3 h-3 rounded-full bg-[#FEBC2E]"></div>
                                        <div className="w-3 h-3 rounded-full bg-[#28C840]"></div>
                                    </div>
                                    <div className="ml-auto flex items-center gap-4">
                                        <div className="relative cursor-pointer" onClick={() => setNotificationsOpen(!notificationsOpen)}>
                                            <Bell className="w-4 h-4 text-gray-400 hover:text-white transition-colors" />
                                            <div className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse-ring"></div>
                                            <div className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></div>
                                            
                                            {/* Notification Dropdown */}
                                            {notificationsOpen && (
                                                <div className="absolute top-8 right-0 w-64 bg-[#252526] border border-white/10 rounded-xl shadow-2xl p-4 z-50">
                                                    <div className="text-xs font-bold text-gray-500 mb-3 uppercase">Notifications</div>
                                                    <div className="space-y-3">
                                                        <div className="flex gap-3 items-start">
                                                            <div className="w-2 h-2 mt-1.5 rounded-full bg-blue-500 shrink-0"></div>
                                                            <div>
                                                                <div className="text-sm text-white font-medium">New Course Added</div>
                                                                <div className="text-xs text-gray-400">Next.js 14 just dropped on Youtube</div>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-3 items-start">
                                                            <div className="w-2 h-2 mt-1.5 rounded-full bg-green-500 shrink-0"></div>
                                                            <div>
                                                                <div className="text-sm text-white font-medium">Sprint Goal Met</div>
                                                                <div className="text-xs text-gray-400">You completed 3 tasks today</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        <Search className="w-4 h-4 text-gray-400" />
                                        <div className="w-6 h-6 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500"></div>
                                    </div>
                                </div>

                                {/* OS Content Layout */}
                                <div className="flex h-full text-white relative">
                                    <TaskModal isOpen={taskModalOpen} onClose={() => setTaskModalOpen(false)} />

                                    {/* OS Sidebar */}
                                    <div className="w-64 bg-[#252526] border-r border-white/5 p-4 hidden md:flex flex-col">
                                        <div className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-4">Workspace</div>
                                        <div className="space-y-1">
                                            <SidebarItem icon={Layout} label="My Career Board" isActive={activeTab === 'board'} onClick={() => setActiveTab('board')} />
                                            <SidebarItem icon={Compass} label="Psych Results" isActive={activeTab === 'psych'} onClick={() => setActiveTab('psych')} />
                                            <SidebarItem icon={Database} label="Resources" isActive={activeTab === 'resources'} onClick={() => setActiveTab('resources')} />
                                        </div>
                                        
                                        <div className="mt-8 text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-4">Smart Lists</div>
                                        <div className="space-y-1">
                                            <SidebarItem icon={() => <div className="w-2 h-2 rounded-full bg-red-500 mr-1"></div>} label="Urgent" />
                                            <SidebarItem icon={() => <div className="w-2 h-2 rounded-full bg-yellow-500 mr-1"></div>} label="Learning" />
                                        </div>
                                    </div>

                                    {/* Main OS Viewport */}
                                    <div className="flex-1 bg-[#1e1e1e] p-6 overflow-y-auto no-scrollbar relative">
                                        
                                        {/* VIEW: BOARD */}
                                        {activeTab === 'board' && (
                                            <div className="animate-in fade-in duration-500">
                                                <div className="flex items-center justify-between mb-8">
                                                    <div>
                                                        <h2 className="text-2xl font-bold flex items-center gap-2">
                                                            Full Stack Developer Roadmap <span className="text-xs bg-white/10 text-white/60 px-2 py-1 rounded border border-white/10">v2.4</span>
                                                        </h2>
                                                        <p className="text-gray-500 text-sm mt-1">Based on your "Analyst" personality type.</p>
                                                    </div>
                                                    <button className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                                                        <Plus className="w-4 h-4" /> Add Task
                                                    </button>
                                                </div>

                                                <div className="mb-8">
                                                    <div className="flex items-center gap-2 mb-3 group">
                                                        <div className="p-1 rounded bg-blue-500/20 text-blue-400"><Maximize2 className="w-3 h-3" /></div>
                                                        <h3 className="text-blue-400 font-bold text-sm">Sprint 1: Backend Fundamentals</h3>
                                                        <span className="text-gray-600 text-xs">3 items</span>
                                                    </div>
                                                    
                                                    {/* Table Header */}
                                                    <div className="grid grid-cols-12 gap-4 text-xs font-semibold text-gray-500 mb-2 px-4">
                                                        <div className="col-span-6">Item</div>
                                                        <div className="col-span-2 text-center">Status</div>
                                                        <div className="col-span-2 text-center">Priority</div>
                                                        <div className="col-span-2 text-center">Timeline</div>
                                                    </div>
